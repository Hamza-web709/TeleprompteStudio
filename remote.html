<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Teleprompter Studio - Mobile Remote</title>
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/base.css">
  <style>
    body {
      background: #0f1013;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
      user-select: none;
    }
    .remote-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .remote-title {
      font-size: 16px;
      font-weight: 700;
    }
    .status-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }
    .status-badge.disconnected {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }
    .script-info {
      text-align: center;
      margin: 16px 0;
    }
    .script-title {
      font-size: 18px;
      font-weight: 600;
      color: #38bdf8;
    }
    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #1e2027;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #4f46e5, #0ea5e9);
      transition: width 0.1s linear;
    }
    .speed-control {
      background: #16181d;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 20px;
    }
    .speed-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .speed-slider {
      width: 100%;
      height: 8px;
      accent-color: #4f46e5;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      flex: 1;
    }
    .btn-remote {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #1e2027;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-remote:active {
      background: #2a2d37;
      transform: scale(0.97);
    }
    .btn-remote.btn-play {
      grid-column: span 2;
      background: #4f46e5;
      font-size: 20px;
      min-height: 80px;
    }
    .btn-remote.btn-play.playing {
      background: #f59e0b;
    }
  </style>
</head>
<body>
  <div class="remote-header">
    <div class="remote-title">Studio Mobile Remote</div>
    <div id="conn-status" class="status-badge disconnected">Connecting...</div>
  </div>

  <div class="script-info">
    <div id="remote-script-title" class="script-title">Active Script</div>
    <div class="progress-bar-container">
      <div id="remote-progress" class="progress-bar-fill"></div>
    </div>
  </div>

  <div class="speed-control">
    <div class="speed-header">
      <span>Scrolling Speed</span>
      <span id="speed-val">3</span>
    </div>
    <input type="range" id="remote-speed-slider" class="speed-slider" min="1" max="20" value="3">
  </div>

  <div class="controls-grid">
    <button id="btn-toggle-play" class="btn-remote btn-play">
      <span id="play-text">PLAY / PAUSE</span>
    </button>
    <button id="btn-jump-back" class="btn-remote">
      <span>⏪ Jump -5s</span>
    </button>
    <button id="btn-jump-fwd" class="btn-remote">
      <span>⏩ Jump +5s</span>
    </button>
    <button id="btn-restart" class="btn-remote" style="grid-column: span 2;">
      <span>🔄 Restart Script</span>
    </button>
  </div>

  <script type="module" src="/src/remote.js"></script>
</body>
</html>
